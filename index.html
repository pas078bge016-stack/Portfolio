            text-transform: uppercase;

        .spatial-lab {

                radial-gradient(circle at 88% 18%, rgba(0, 212, 170, 0.14), transparent 28%),

            box-shadow: 0 30px 80px rgba(15, 23, 42, 0.2);
        }

        .spatial-lab::before {
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(rgba(182, 211, 255, 0.045) 1px, transparent 1px),
                linear-gradient(90deg, rgba(182, 211, 255, 0.045) 1px, transparent 1px);
            background-size: 34px 34px;
            mask-image: linear-gradient(115deg, #000 0%, transparent 78%);
            content: '';
            pointer-events: none;
        }

        .spatial-lab-content,
        .spatial-visuals {
            position: relative;
            z-index: 1;
        }

        .spatial-lab-kicker {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 14px;

            font-size: 0.75rem;
            font-weight: 800;
            letter-spacing: 0.16em;
            text-transform: uppercase;
        }

        .spatial-lab h2 {
            margin-bottom: 18px;
            color: white;
            text-align: left;
            font-size: clamp(1.8rem, 4vw, 3rem);
        }

        .spatial-lab h2::after {
            display: none;
        }

        .spatial-lab-copy {
            max-width: 590px;
            color: rgba(222, 234, 251, 0.74);
            font-size: 1rem;
        }

        .elevation-chart {
            position: relative;
            padding: 18px 18px 12px;
            overflow: hidden;
            border: 1px solid rgba(180, 210, 255, 0.16);
            border-radius: 20px;
            background: rgba(5, 14, 29, 0.64);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.04);
        }

        .elevation-chart-head {
            display: flex;
            justify-content: space-between;

            align-items: center;
            margin-bottom: 10px;

            font-size: 0.8rem;
            font-weight: 700;
        }

        .chart-units {
            color: #8fa7c9;
            font-size: 0.68rem;
            font-weight: 500;
        }

        #elevation-profile {
            display: block;
            width: 100%;
            height: 190px;
        }

        .elevation-chart-foot {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            color: #98accb;
            font-size: 0.69rem;
        }

        .spatial-visuals {
            display: grid;
            justify-items: center;
            gap: 20px;
        }

        .compass-rose {
            position: relative;
            display: grid;
            width: clamp(150px, 17vw, 210px);
            aspect-ratio: 1;
            place-items: center;
            border: 1px solid rgba(159, 211, 255, 0.26);
            border-radius: 50%;
            background:
                radial-gradient(circle, rgba(117, 228, 216, 0.11) 0 32%, transparent 33%),
                repeating-conic-gradient(from 0deg, rgba(198, 220, 255, 0.43) 0deg 0.6deg, transparent 0.6deg 15deg),
                rgba(9, 23, 43, 0.75);
            box-shadow: 0 0 48px rgba(63, 173, 217, 0.12), inset 0 0 30px rgba(88, 149, 220, 0.1);
            animation: compassHover 5s ease-in-out infinite;
        }

        .compass-rose::before,
        .compass-rose::after {
            position: absolute;
            inset: 10%;
            border: 1px solid rgba(166, 209, 255, 0.16);
            border-radius: 50%;
            content: '';
        }

        .compass-rose::after {
            inset: 22%;
        }

        .compass-cardinal {
            position: absolute;
            color: #a9c3e8;
            font-size: 0.65rem;
            font-weight: 800;
            letter-spacing: 0.08em;
        }

        .compass-cardinal.north { top: 8%; color: #8cf2d5; }
        .compass-cardinal.east { right: 9%; }
        .compass-cardinal.south { bottom: 8%; }
        .compass-cardinal.west { left: 8%; }

        .compass-needle {
            position: relative;
            z-index: 1;
            width: 34px;
            height: 88px;
            clip-path: polygon(50% 0, 100% 50%, 50% 100%, 0 50%);
            background: linear-gradient(180deg, #8cf2d5 0 49%, #6e89f8 50% 100%);
            filter: drop-shadow(0 0 12px rgba(115, 230, 216, 0.45));
            animation: compassNeedle 18s linear infinite;
        }

        .spatial-coordinates {
            display: grid;
            grid-template-columns: auto auto;
            gap: 5px 14px;
            padding: 12px 16px;
            border: 1px solid rgba(170, 202, 244, 0.18);
            border-radius: 14px;
            background: rgba(5, 14, 29, 0.48);
            color: #94a9c8;
            font-size: 0.68rem;
        }

        .spatial-coordinates strong {
            color: #e4eeff;
            font-weight: 600;
        }

        .signal-panel-live {
            color: #b4c6e2;
        }

        .signal-panel-live::before {
            background: #8ba8ff;
            box-shadow: 0 0 12px #8ba8ff;
        }

        .motion-reveal {
            opacity: 0;
            transform: translate3d(0, 26px, 0) scale(0.985);
            transition:
                opacity 0.75s cubic-bezier(0.2, 0.8, 0.2, 1),
                transform 0.75s cubic-bezier(0.2, 0.8, 0.2, 1);
            transition-delay: var(--motion-delay, 0ms);
        }

        .motion-reveal.is-visible {
            opacity: 1;
            transform: translate3d(0, 0, 0) scale(1);
        }

        .fieldwork-card.motion-reveal {
            transform: translate3d(0, 34px, 0) scale(0.975);
        }

        .fieldwork-card.motion-reveal.is-visible {
            transform: translate3d(0, 0, 0) scale(1);
        }

        .hero-img-container {
            transform-style: preserve-3d;
            will-change: transform;
        }

        .hero-img {
            transition: filter 0.5s ease, box-shadow 0.5s ease;
        }

        .hero-img {
            animation-duration: 5s;
        }

        .hero-chip {
            animation: chipSignal 4.8s ease-in-out infinite;
            animation-delay: calc(var(--chip-index, 0) * 220ms);
        }

        .hero-chip:nth-child(2) { --chip-index: 1; }
        .hero-chip:nth-child(3) { --chip-index: 2; }
        .hero-chip:nth-child(4) { --chip-index: 3; }
        .hero-chip:nth-child(5) { --chip-index: 4; }
        .hero-chip:nth-child(6) { --chip-index: 5; }

        @keyframes contourFlow {
            to { stroke-dashoffset: -240; }
        }

        @keyframes topoDrift {
            from { transform: translate3d(-0.6%, 0, 0) scale(1); }
            to { transform: translate3d(0.6%, -0.5%, 0) scale(1.025); }
        }

        @keyframes topoScan {
            0% { transform: translateX(0); opacity: 0; }
            18%, 78% { opacity: 1; }
            100% { transform: translateX(560%); opacity: 0; }
        }

        @keyframes chipSignal {
            0%, 100% { box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08); }
            50% { box-shadow: 0 8px 24px rgba(0, 212, 170, 0.24); }
        }

        @keyframes signalCardEnter {
            from { opacity: 0; transform: translateY(20px) scale(0.96); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        @keyframes signalCardFloat {
            0%, 100% { translate: 0 0; }
            50% { translate: 0 -7px; }
        }

        @keyframes livePulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.45; transform: scale(0.72); }
        }

        @keyframes compassHover {
            0%, 100% { transform: translateY(0) rotate(-2deg); }
            50% { transform: translateY(-8px) rotate(2deg); }
        }

        @keyframes compassNeedle {
            from { transform: rotate(-18deg); }
            to { transform: rotate(342deg); }
        }

        @media (max-width: 992px) {
            .hero-content {
                grid-template-columns: minmax(0, 0.9fr) minmax(330px, 1.1fr);
                gap: 32px;
            }

            .hero-img-container {
                width: min(42vw, 440px);
            }

            .fieldwork-card:first-child {
                min-height: 430px;
            }

            .fieldwork-card,
            .fieldwork-card:nth-child(3) {
                min-height: 290px;
            }
        }

        @media (max-width: 1280px) {
            .menu-toggle {
                display: block;
                position: relative;
                z-index: 1002;
            }

            .nav-links {
                position: fixed;
                top: 70px;
                left: -110%;
                width: min(420px, 100vw);
                height: calc(100dvh - 70px);
                overflow-y: auto;
                flex-direction: column;
                align-items: center;
                padding: 28px 18px 40px;
                background: rgba(255, 255, 255, 0.98);
                box-shadow: 20px 20px 60px rgba(15, 23, 42, 0.16);
                transition: left 0.38s cubic-bezier(0.2, 0.8, 0.2, 1);
            }

            .nav-links.active {
                left: 0;
            }

            .nav-links li {
                margin: 11px 0;
            }
        }

        @media (max-width: 768px) {
            .hero-content {
                grid-template-columns: minmax(0, 1fr);
                gap: 30px;
            }

            .hero-img-container {
                grid-row: 1;
                width: min(78vw, 390px) !important;
                aspect-ratio: 0.95;
            }

            .hero-text {
                grid-row: 2;
                max-width: 620px;
            }

            .hero-text > p:nth-of-type(2) {
                max-width: 560px !important;
                margin-left: auto;
                margin-right: auto;
            }

            .fieldwork-section {
                padding: 66px 0 72px;
            }

            .fieldwork-grid {
                grid-template-columns: minmax(0, 1fr);
                gap: 16px;
            }

            .fieldwork-card,
            .fieldwork-card:first-child,
            .fieldwork-card:nth-child(2),
            .fieldwork-card:nth-child(3) {
                min-height: min(110vw, 460px);
                grid-column: auto;
                grid-row: auto;
            }

            .fieldwork-card:first-child {
                min-height: min(125vw, 500px);
            }

            .signal-panel {
                right: -8px;
                bottom: 18px;
                width: min(235px, 68%);
            }

            .spatial-lab {
                grid-template-columns: minmax(0, 1fr);
                gap: 28px;
                margin-top: 46px;
                padding: 24px 18px;
            }

            .spatial-visuals {
                grid-template-columns: minmax(120px, 0.8fr) minmax(0, 1fr);
                gap: 14px;
            }

            .compass-rose {
                width: min(34vw, 165px);
            }

            #elevation-profile {
                height: 160px;
            }
        }

        @media (max-width: 420px) {
            .hero-img-container {
                width: min(76vw, 330px) !important;
            }

            .fieldwork-card-copy {
                right: 18px;
                bottom: 18px;
                left: 18px;
            }

            .elevation-chart {
                padding: 14px 12px 10px;
            }

            .spatial-visuals {
                grid-template-columns: minmax(0, 1fr);
            }

            .compass-rose {
                width: 145px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .hero-artifacts {
                animation: none;
            }

            .hero-artifacts::after {
                display: none;
            }

            .contour-line {
                animation-duration: 90s !important;
                stroke-dasharray: 2 18;
            }

            .hero-img {
                animation: portraitFloatReduced 12s ease-in-out infinite;
            }

            .hero-chip {
                animation: none;
            }

            .signal-panel,
            .signal-panel-live::before {
                animation: none;
            }

            .compass-rose,
            .compass-needle {
                animation: none !important;
            }

            .motion-reveal {
                transition-duration: 0.35s;
            }

            .motion-reveal,
            .fieldwork-card.motion-reveal {
                opacity: 1;
                transform: none;
                transition: none;
            }
        }
    </style>
</head>

    function renderPortfolio(D) {

    // ─── HERO ───
    document.getElementById('hero-section').innerHTML = `

    // Let the timeline tell its story as each milestone enters the viewport.
    (function () {
        const timeline = document.querySelector('.timeline');
        const milestones = [...document.querySelectorAll('.timeline-item')];
        if (!timeline || !milestones.length) return;

        const setActiveMilestone = (milestone, index) => {
            milestones.forEach((item, itemIndex) => {
                const isActive = item === milestone;
                item.classList.toggle('is-active', isActive);
                item.querySelector('.timeline-marker').setAttribute('aria-pressed', String(isActive));
                if (isActive) item.setAttribute('aria-current', 'step');
                else item.removeAttribute('aria-current');
            });
            timeline.style.setProperty('--timeline-progress', String(index / Math.max(milestones.length - 1, 1)));
        };

        milestones.forEach((milestone, index) => {
            milestone.querySelector('.timeline-marker').addEventListener('click', () => {
                setActiveMilestone(milestone, index);
            });
        });

        const milestoneObserver = new IntersectionObserver(entries => {
            const visibleMilestone = entries
                .filter(entry => entry.isIntersecting)
                .sort((a, b) => b.intersectionRatio - a.intersectionRatio)[0];
            if (!visibleMilestone) return;
            setActiveMilestone(visibleMilestone.target, milestones.indexOf(visibleMilestone.target));
        }, { threshold: [0.2, 0.45, 0.7], rootMargin: '-18% 0px -28% 0px' });

        milestones.forEach(milestone => milestoneObserver.observe(milestone));
    })();

        document.getElementById('footer-date').dateTime = now.toISOString();
        document.getElementById('footer-time').textContent = footerTimeFormatter.format(now);
        document.getElementById('footer-time').dateTime = now.toISOString();
    };
    updateFooterClock();
    window.setInterval(updateFooterClock, 1000);

    // ====================================
    // INTERACTIONS & ANIMATIONS (unchanged)
    // ====================================

    // Mobile Menu Toggle
    document.querySelector('.menu-toggle').addEventListener('click', function () {
        document.querySelector('.nav-links').classList.toggle('active');
    });

    const parallaxSections = document.querySelectorAll('.section-parallax');
    const updateParallax = () => {
        const scrollY = window.scrollY;
        parallaxSections.forEach((section, index) => {
            const depth = parseFloat(section.dataset.parallaxDepth || (index % 2 === 0 ? 0.03 : 0.05));
            const offset = Math.max(-24, Math.min(24, scrollY * depth));
            section.style.setProperty('--parallax-y', `${offset}px`);
        });
    };
    window.addEventListener('scroll', updateParallax, { passive: true });
    updateParallax();

    // Skills intro interaction
    document.querySelectorAll('.skill-intro-tab').forEach(button => {
        button.addEventListener('click', () => {
            const index = button.getAttribute('data-index');
            document.querySelectorAll('.skill-intro-tab').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.skill-intro-panel').forEach(panel => panel.classList.remove('active'));
            button.classList.add('active');
            document.querySelector(`.skill-intro-panel[data-panel="${index}"]`).classList.add('active');
        });
    });

    // Close mobile menu on link click
    document.querySelectorAll('.nav-links a').forEach(link => {
        link.addEventListener('click', () => {
            document.querySelector('.nav-links').classList.remove('active');
        });
    });

    // Scroll animations
    const fadeElements = document.querySelectorAll('.fade-in');
    const fadeInObserver = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
            if (entry.isIntersecting) {
                entry.target.classList.add('visible');
                if (entry.target.classList.contains('skill-category')) {
                    entry.target.querySelectorAll('.skill-level').forEach(bar => {
                        setTimeout(() => { bar.style.width = bar.getAttribute('data-level') + '%'; }, 200);
                    });
                }
                if (entry.target.classList.contains('teaching-stats')) {
                    animateStatistics();
                    animateCharts();
                }
            }
        });
    }, { threshold: 0.1 });
    fadeElements.forEach(el => fadeInObserver.observe(el));

    // Animate Statistics Numbers
    function animateStatistics() {
        document.querySelectorAll('.stat-item').forEach((item, index) => {
            setTimeout(() => {
                item.classList.add('is-animating');
            }, index * 110);
        });

        document.querySelectorAll('.stat-number').forEach(stat => {
            const target = parseInt(stat.getAttribute('data-target'), 10) || 0;
            const duration = 1400;
            const startTime = performance.now();
            const easeOutCubic = t => 1 - Math.pow(1 - t, 3);

            const step = (now) => {
                const progress = Math.min(1, (now - startTime) / duration);
                const eased = easeOutCubic(progress);
                const value = Math.floor(target * eased);
                stat.textContent = value.toLocaleString();
                if (progress < 1) {
                    requestAnimationFrame(step);
                } else {
                    stat.textContent = target.toLocaleString();
                }
            };

            requestAnimationFrame(step);
        });
    }

    // Animate Charts
    function animateCharts() {
        document.querySelectorAll('.chart-fill').forEach(fill => {
            setTimeout(() => { fill.style.width = fill.getAttribute('data-width') + '%'; }, 500);
        });
        const growthLine = document.querySelector('.growth-line');
        if (growthLine) setTimeout(() => { growthLine.style.height = growthLine.getAttribute('data-height') + '%'; }, 500);
    }

    // WhatsApp Form
    document.getElementById('contactForm').addEventListener('submit', function (e) {
        e.preventDefault();
        const name = document.getElementById('name').value;
        const email = document.getElementById('email').value;
        const subject = document.getElementById('subject').value;
        const message = document.getElementById('message').value;
        const msg = `Name: ${name}%0AEmail: ${email}%0ASubject: ${subject}%0AMessage: ${message}`;
        window.open(`https://wa.me/${D.contact.whatsapp}?text=${msg}`, '_blank');
        this.reset();
    });

    // Smooth scrolling
    document.querySelectorAll('a[href^="#"]').forEach(anchor => {
        anchor.addEventListener('click', function (e) {
            e.preventDefault();
            const id = this.getAttribute('href');
            if (id === '#') return;
            const el = document.querySelector(id);
            if (el) window.scrollTo({ top: el.offsetTop - 70, behavior: 'smooth' });
        });
    });

    // Reveal section content as it enters the viewport.
    const motionTargets = document.querySelectorAll(
        'section:not(.hero) h2, .fade-in, .motion-reveal'
    );
    const motionObserver = new IntersectionObserver((entries, observer) => {
        entries.forEach(entry => {
            if (!entry.isIntersecting) return;
            entry.target.classList.add('is-visible');
            entry.target.classList.add('visible');
            observer.unobserve(entry.target);
        });
    }, { threshold: 0.12, rootMargin: '0px 0px -35px 0px' });
    motionTargets.forEach((element, index) => {
        element.classList.add('motion-reveal');
        element.style.setProperty('--motion-delay', `${(index % 4) * 75}ms`);
        motionObserver.observe(element);
    });

    // Add a small, decorative GNSS-style signal trace to the hero portrait.
    (function () {
        const canvas = document.getElementById('survey-graph');
        const context = canvas?.getContext('2d');
        if (!canvas || !context) return;

        const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        let width = 0;
        let height = 0;
        let frame = 0;

        function resizeSignalGraph() {
            const rect = canvas.getBoundingClientRect();
            const pixelRatio = Math.min(window.devicePixelRatio || 1, 2);
            width = rect.width;
            height = rect.height;
            canvas.width = Math.round(width * pixelRatio);
            canvas.height = Math.round(height * pixelRatio);
            context.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);
            if (reducedMotion) drawSignalGraph(0);
        }

        function drawSignalGraph(time) {
            if (!width || !height) return;
            const animationTime = reducedMotion ? time * 0.28 : time;
            context.clearRect(0, 0, width, height);
            context.lineWidth = 1;

            for (let x = 0; x <= width; x += width / 6) {
                context.beginPath();
                context.moveTo(x, 0);
                context.lineTo(x, height);
                context.strokeStyle = 'rgba(192, 219, 255, 0.1)';
                context.stroke();
            }
            for (let y = 0; y <= height; y += height / 3) {
                context.beginPath();
                context.moveTo(0, y);
                context.lineTo(width, y);
                context.strokeStyle = 'rgba(192, 219, 255, 0.1)';
                context.stroke();
            }

            [
                { color: '#7ef2d0', amplitude: 0.21, frequency: 2.4, phase: 0 },
                { color: '#8ba8ff', amplitude: 0.13, frequency: 4.1, phase: 2.2 }
            ].forEach(signal => {
                context.beginPath();
                for (let x = 0; x <= width; x += 2) {
                    const progress = x / width;
                    const wave = Math.sin(progress * Math.PI * signal.frequency * 2 + animationTime * 0.0018 + signal.phase);
                    const detail = Math.sin(progress * Math.PI * 17 + animationTime * 0.0007) * 0.08;
                    const y = height * 0.5 - (wave + detail) * height * signal.amplitude;
                    if (x === 0) context.moveTo(x, y);
                    else context.lineTo(x, y);
                }
                context.strokeStyle = signal.color;
                context.shadowBlur = 10;
                context.shadowColor = signal.color;
                context.lineWidth = 1.6;
                context.stroke();
                context.shadowBlur = 0;
            });

            if (document.visibilityState === 'visible') {
                frame = window.requestAnimationFrame(drawSignalGraph);
            }
        }

        resizeSignalGraph();
        window.addEventListener('resize', resizeSignalGraph, { passive: true });
        frame = window.requestAnimationFrame(drawSignalGraph);
        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'hidden') {
                window.cancelAnimationFrame(frame);
            } else {
                frame = window.requestAnimationFrame(drawSignalGraph);
            }
        });
    })();

    // Animated, illustrative terrain profile for the geomatics feature panel.
    (function () {
        const canvas = document.getElementById('elevation-profile');
        const context = canvas?.getContext('2d');
        if (!canvas || !context) return;

        const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        const profile = [0.75, 0.7, 0.72, 0.59, 0.64, 0.46, 0.5, 0.32, 0.38, 0.22, 0.31, 0.19, 0.27, 0.1];
        let width = 0;
        let height = 0;
        let frame = 0;

        function resizeElevationProfile() {
            const rect = canvas.getBoundingClientRect();
            const ratio = Math.min(window.devicePixelRatio || 1, 2);
            width = rect.width;
            height = rect.height;
            canvas.width = Math.round(width * ratio);
            canvas.height = Math.round(height * ratio);
            context.setTransform(ratio, 0, 0, ratio, 0, 0);
            if (reducedMotion) drawElevationProfile(1);
        }

        function drawElevationProfile(time) {
            if (width < 2 || height < 2) return;
            context.clearRect(0, 0, width, height);

            const left = 34;
            const right = width - 8;
            const top = 8;
            const bottom = height - 22;
            const plotWidth = right - left;
            const plotHeight = bottom - top;

            context.font = '10px Inter, sans-serif';
            context.textBaseline = 'middle';
            context.lineWidth = 1;
            for (let i = 0; i <= 4; i++) {
                const y = top + plotHeight * i / 4;
                context.beginPath();
                context.moveTo(left, y);
                context.lineTo(right, y);
                context.strokeStyle = 'rgba(192, 219, 255, 0.13)';
                context.stroke();
                context.fillStyle = 'rgba(174, 194, 222, 0.68)';
                context.textAlign = 'left';
                context.fillText(String(2400 - i * 100), 0, y);
            }

            for (let i = 0; i <= 4; i++) {
                const x = left + plotWidth * i / 4;
                context.beginPath();
                context.moveTo(x, top);
                context.lineTo(x, bottom);
                context.strokeStyle = 'rgba(192, 219, 255, 0.1)';
                context.stroke();
                context.fillStyle = 'rgba(174, 194, 222, 0.7)';
                context.textAlign = i === 4 ? 'right' : 'center';
                context.fillText(`${i * 0.5} km`, x, height - 8);
            }

            const points = profile.map((value, index) => ({
                x: left + plotWidth * index / (profile.length - 1),
                y: top + plotHeight * value
            }));
            const profileTime = reducedMotion ? time * 0.28 : time;
            const progress = (profileTime % 5200) / 5200;

            context.beginPath();
            context.moveTo(points[0].x, bottom);
            points.forEach(point => context.lineTo(point.x, point.y));
            context.lineTo(points[points.length - 1].x, bottom);
            context.closePath();
            const fill = context.createLinearGradient(0, top, 0, bottom);
            fill.addColorStop(0, 'rgba(113, 238, 208, 0.27)');
            fill.addColorStop(1, 'rgba(113, 238, 208, 0.015)');
            context.fillStyle = fill;
            context.fill();

            const currentIndex = Math.min(points.length - 1, Math.floor(progress * (points.length - 1)));
            const nextIndex = Math.min(points.length - 1, currentIndex + 1);
            const segmentProgress = progress * (points.length - 1) - currentIndex;
            const current = {
                x: points[currentIndex].x + (points[nextIndex].x - points[currentIndex].x) * segmentProgress,
                y: points[currentIndex].y + (points[nextIndex].y - points[currentIndex].y) * segmentProgress
            };

            context.beginPath();
            points.forEach((point, index) => {
                if (index === 0) context.moveTo(point.x, point.y);
                else context.lineTo(point.x, point.y);
            });
            context.strokeStyle = '#7ef2d0';
            context.lineWidth = 2.4;
            context.lineJoin = 'round';
            context.shadowBlur = 12;
            context.shadowColor = 'rgba(126, 242, 208, 0.65)';
            context.stroke();
            context.shadowBlur = 0;

            context.beginPath();
            context.moveTo(current.x, top);
            context.lineTo(current.x, bottom);
            context.strokeStyle = 'rgba(126, 242, 208, 0.42)';
            context.lineWidth = 1;
            context.setLineDash([3, 5]);
            context.stroke();
            context.setLineDash([]);

            context.beginPath();
            context.arc(current.x, current.y, 4.2, 0, Math.PI * 2);
            context.fillStyle = '#f4fffc';
            context.fill();
            context.beginPath();
            context.arc(current.x, current.y, 8, 0, Math.PI * 2);
            context.strokeStyle = 'rgba(126, 242, 208, 0.55)';
            context.lineWidth = 1.2;
            context.stroke();

            if (document.visibilityState === 'visible') {
                frame = window.requestAnimationFrame(drawElevationProfile);
            }
        }

        resizeElevationProfile();
        window.addEventListener('resize', resizeElevationProfile, { passive: true });
        frame = window.requestAnimationFrame(drawElevationProfile);
        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'hidden') {
                window.cancelAnimationFrame(frame);
            } else {
                frame = window.requestAnimationFrame(drawElevationProfile);
            }
        });
    })();

    // Particle Animation
    (function () {
        const canvas = document.getElementById('particles-canvas');
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        let particles = [];
        const count = 60;

        function resize() {
            const hero = canvas.parentElement;
            canvas.width = hero.offsetWidth;
            canvas.height = hero.offsetHeight;
        }
        resize();
        window.addEventListener('resize', resize);

        class P {
            constructor() { this.reset(); }
            reset() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.vx = (Math.random() - 0.5) * 0.6;
                this.vy = (Math.random() - 0.5) * 0.6;
                this.r = Math.random() * 2 + 1;
                this.o = Math.random() * 0.5 + 0.2;
            }
            update() {
                this.x += this.vx; this.y += this.vy;
                if (this.x < 0 || this.x > canvas.width) this.vx *= -1;
                if (this.y < 0 || this.y > canvas.height) this.vy *= -1;
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255,255,255,${this.o})`;
                ctx.fill();
            }
        }
        for (let i = 0; i < count; i++) particles.push(new P());

        function loop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => { p.update(); p.draw(); });
            for (let i = 0; i < particles.length; i++) {
                for (let j = i + 1; j < particles.length; j++) {
                    const dx = particles[i].x - particles[j].x;
                    const dy = particles[i].y - particles[j].y;
                    const d = Math.sqrt(dx * dx + dy * dy);
                    if (d < 120) {
                        ctx.beginPath();
                        ctx.moveTo(particles[i].x, particles[i].y);
                        ctx.lineTo(particles[j].x, particles[j].y);
                        ctx.strokeStyle = `rgba(255,255,255,${0.1 * (1 - d / 120)})`;
                        ctx.lineWidth = 0.5;
                        ctx.stroke();
                    }
                }
            }
            requestAnimationFrame(loop);
        }
        loop();
    })();
    } // End of renderPortfolio

    // Initialize the portfolio
    initPortfolio();
    </script>
